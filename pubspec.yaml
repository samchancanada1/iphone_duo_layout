name: iphone_duo_layout
description: 'Native iPhone Duo layout adaptation for Flutter: reserved regions, hinge updates, adaptive layouts and system toolbars.'
version: 0.1.0-dev.1
repository: https://github.com/samchancanada1/iphone_duo_layout

screenshots:
  - description: 'Illustrated split and span layouts with Flutter content. Experimental concept preview, not a device capture.'
    path: doc/media/layout-modes.png
  - description: 'Illustrated loop showing split, span, reserved regions and a native toolbar. Not a simulator capture.'
    path: doc/media/layout-preview.gif

environment:
  sdk: ^3.12.2
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: IPhoneDuoLayoutPlugin
